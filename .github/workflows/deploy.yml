name: Deploy

# Anything that lands on main ships. Merging a pull request is a push to main,
# so a merge is all it takes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. If two merges land close together the newer one waits
# rather than racing the older one to Cloudflare.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail here rather than shipping a broken build.
      - run: npm run typecheck

      # Must precede the deploy: wrangler.toml uploads ./dist/client as the
      # Worker's assets, and deploying a stale or missing build serves a blank
      # page.
      - run: npm run build

      # Safe to re-run: D1 records which migrations have already been applied.
      - run: npx wrangler d1 migrations apply finance-db --remote

      - run: npx wrangler deploy
